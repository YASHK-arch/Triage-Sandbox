name: Resolve Issue with OpenHands

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  call-openhands-resolver:
    # Trigger the agent only when an issue comment starts with /resolve
    if: github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/resolve')
    
    # Use the reusable workflow from the OpenHands repository
    uses: All-Hands-AI/OpenHands/.github/workflows/openhands-resolver.yml@main
    with:
      macro: '/resolve'
    secrets:
      # You need to configure these secrets in your GitHub repository settings:
      
      # Use your existing GROQ_API_KEY
      LLM_API_KEY: ${{ secrets.GROQ_API_KEY }}
      
      # Use Groq's fastest large model
      LLM_MODEL: "groq/llama-3.1-70b-versatile"
      
      # A GitHub Personal Access Token is recommended over standard GITHUB_TOKEN
      # so that the PRs created by the agent can trigger other CI workflows.
      PAT_USERNAME: ${{ secrets.PAT_USERNAME }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
